<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cassa Comune</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>💰 Cassa Comune</h1>

    <p class="subtitle">
        Dashboard aggiornata automaticamente
    </p>

</header>


<main>

    <section class="cards">

        <div class="card">
            <h3>Saldo Cassa</h3>
            <span id="saldoCassa">€ 0,00</span>
        </div>

        <div class="card">
            <h3>Versamenti</h3>
            <span id="totVersamenti">€ 0,00</span>
        </div>

        <div class="card">
            <h3>Spese</h3>
            <span id="totSpese">€ 0,00</span>
        </div>

        <div class="card">
            <h3>Partecipanti</h3>
            <span id="numPartecipanti">0</span>
        </div>

    </section>



    <section class="panel">

        <h2>👥 Saldi Partecipanti</h2>

        <table id="tblPartecipanti">

            <thead>

            <tr>

                <th>Nome</th>

                <th>Versato</th>

                <th>Consumato</th>

                <th>Saldo</th>

            </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </section>




    <section class="panel">

        <h2>🛒 Ultime Spese</h2>

        <table id="tblSpese">

            <thead>

            <tr>

                <th>Data</th>

                <th>Descrizione</th>

                <th>Categoria</th>

                <th>Importo</th>

                <th>Pagato da</th>

            </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </section>



</main>


<footer>

Aggiornato automaticamente dal file LibreOffice

</footer>


<script src="app.js"></script>

</body>

</html>
